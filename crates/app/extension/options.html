<!doctype html>
<meta charset="utf-8">
<title>DownCraft options</title>
<style>
  body{font:14px "Segoe UI",Tahoma,sans-serif;background:#222;color:#ddd;max-width:520px;margin:24px auto;padding:0 16px}
  label{display:block;margin:14px 0 4px}
  input[type=text],input[type=number]{width:100%;box-sizing:border-box;padding:6px;background:#fafafa;color:#111;border:1px solid #666;border-radius:3px}
  small{color:#999}
  button{margin-top:18px;background:#383838;color:#eee;border:1px solid #6a6a6a;border-radius:3px;padding:6px 18px;cursor:pointer}
</style>
<h2>DownCraft</h2>
<label><input type="checkbox" id="intercept"> Take over browser downloads</label>
<small>Alt+click a link to let the browser download it instead. If DownCraft isn’t running, the browser keeps the download.</small>
<label>Only take over these file types <small>(empty = all; e.g. zip, iso, mp4)</small></label>
<input type="text" id="onlyExt">
<label>Ignore downloads smaller than (MB)</label>
<input type="number" id="minSizeMB" min="0" step="1">
<label>Never take over from these sites <small>(comma separated)</small></label>
<input type="text" id="skipHosts">
<button id="save">Save</button> <small id="msg"></small>
<script src="options.js"></script>
