<!doctype html>
<meta charset="utf-8">
<style>
  body{margin:0;width:380px;background:#222;color:#ddd;font:13px "Segoe UI",Tahoma,sans-serif}
  header{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#111}
  header img{width:22px;height:22px}
  header b{flex:1}
  .dot{width:9px;height:9px;border-radius:50%;background:#888}
  .dot.on{background:#3ccf4e}.dot.off{background:#e5534b}
  #list{max-height:300px;overflow:auto}
  .it{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid #333}
  .it .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .it small{color:#999}
  button{background:#383838;color:#eee;border:1px solid #6a6a6a;border-radius:3px;padding:3px 10px;cursor:pointer}
  button:hover{background:#464646}
  .empty{padding:18px 12px;color:#999;line-height:1.5}
  footer{padding:8px 12px;color:#888;font-size:11.5px}
</style>
<header><img src="icons/48.png"><b>DownCraft</b><span id="st" class="dot"></span><span id="stt"></span></header>
<div id="list"></div>
<footer>Play the video for a moment so its link can be detected.</footer>
<script src="formats.js"></script>
<script src="popup.js"></script>
