[package]
name = "downcraft-app"
description = "DownCraft – a cross-platform download manager (desktop UI)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "downcraft"
path = "src/main.rs"

[build-dependencies]
zip = { version = "0.6", default-features = false, features = ["deflate"] }

[dependencies]
downcraft-core = { path = "../core" }
eframe = { version = "0.27", features = ["persistence"] }
egui_extras = { version = "0.27", features = ["datepicker"] }
rfd = { version = "0.14", default-features = false, features = ["xdg-portal", "async-std"] }
image = { version = "0.24", default-features = false, features = ["png", "jpeg"] }
zip = { version = "0.6", default-features = false, features = ["deflate"] }
open = "5"
# clipboard monitor (text only: no image support needed)
arboard = { version = "3", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon = { version = "0.19", default-features = false }
# native drag-out of a file (the extension zip) onto the browser
drag = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm", "Win32_System_Threading"] }
